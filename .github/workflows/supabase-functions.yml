# Déploiement des fonctions serveur Supabase (daily, marche, platform, stripe-webhook, assistant, dvf, annonce) et de leurs secrets.
# Lancement manuel : Actions → « Fonctions serveur Supabase » → Run workflow.
# À définir dans Settings → Secrets and variables → Actions :
#   Secret obligatoire : SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens)
#   Secrets facultatifs (transmis tels quels aux fonctions s'ils existent) :
#     CRON_SECRET, RESEND_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, ANTHROPIC_API_KEY (assistant)
#   Variables facultatives (onglet Variables, ou Secrets : les deux sont lus) : SUPABASE_PROJECT_REF, APP_URL, EMAIL_FROM, EMAIL_REPLY_TO, EMAIL_ENABLED, ASSISTANT_MODEL, ASSISTANT_DAILY_LIMIT
name: Fonctions serveur Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF || 'sbxnjvjsapnsdeenmvtm' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ASSISTANT_MODEL: ${{ vars.ASSISTANT_MODEL || secrets.ASSISTANT_MODEL }}
      ASSISTANT_DAILY_LIMIT: ${{ vars.ASSISTANT_DAILY_LIMIT || secrets.ASSISTANT_DAILY_LIMIT }}
      APP_URL: ${{ vars.APP_URL || secrets.APP_URL || 'https://immo-zen.fr/app/' }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM || secrets.EMAIL_FROM }}
      EMAIL_REPLY_TO: ${{ vars.EMAIL_REPLY_TO || secrets.EMAIL_REPLY_TO }}
      EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || secrets.EMAIL_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      # Installation directe de la CLI Supabase (dernière version publiée) : le lien de téléchargement
      # n'utilise pas l'API GitHub, donc pas d'erreur « rate limit exceeded ».
      - name: Installer la CLI Supabase
        run: |
          curl -fsSL --retry 3 -o /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/supabase.tar.gz -C "$HOME/.local/bin" supabase
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/supabase" --version
      - name: Vérifier le jeton
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Secret SUPABASE_ACCESS_TOKEN manquant (Settings → Secrets and variables → Actions)."; exit 1; fi
      - name: Secrets des fonctions
        run: |
          args=()
          for k in CRON_SECRET RESEND_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET ANTHROPIC_API_KEY ASSISTANT_MODEL ASSISTANT_DAILY_LIMIT APP_URL EMAIL_FROM EMAIL_REPLY_TO EMAIL_ENABLED; do
            v="${!k}"
            if [ -n "$v" ]; then args+=("$k=$v"); echo "→ $k transmis"; fi
          done
          supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"
      - name: E-mails du compte en français (confirmation, mot de passe, invitation…)
        continue-on-error: true
        run: |
          # Modèles de supabase/templates appliqués au projet par l'API de gestion Supabase
          body=$(jq -n \
            --slurpfile s supabase/templates/subjects.json \
            --rawfile confirmation supabase/templates/confirmation.html \
            --rawfile recovery supabase/templates/recovery.html \
            --rawfile invite supabase/templates/invite.html \
            --rawfile magic_link supabase/templates/magic_link.html \
            --rawfile email_change supabase/templates/email_change.html \
            --rawfile reauthentication supabase/templates/reauthentication.html \
            '{
              mailer_subjects_confirmation: $s[0].confirmation, mailer_templates_confirmation_content: $confirmation,
              mailer_subjects_recovery: $s[0].recovery, mailer_templates_recovery_content: $recovery,
              mailer_subjects_invite: $s[0].invite, mailer_templates_invite_content: $invite,
              mailer_subjects_magic_link: $s[0].magic_link, mailer_templates_magic_link_content: $magic_link,
              mailer_subjects_email_change: $s[0].email_change, mailer_templates_email_change_content: $email_change,
              mailer_subjects_reauthentication: $s[0].reauthentication, mailer_templates_reauthentication_content: $reauthentication
            }')
          code=$(curl -sS -o /tmp/auth.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data "$body")
          if [ "$code" != "200" ]; then echo "::error::Modèles d'e-mails non appliqués (HTTP $code) : $(head -c 300 /tmp/auth.json)"; exit 1; fi
          echo "Modèles d'e-mails en français appliqués."
      - name: Fonction daily (tâches quotidiennes, e-mails)
        run: supabase functions deploy daily --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Fonction marche (données de marché, chaque nuit)
        run: supabase functions deploy marche --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Fonction stripe-webhook
        run: supabase functions deploy stripe-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Fonction platform (paiement, espace client, invitations)
        run: supabase functions deploy platform --project-ref "$PROJECT_REF"
      - name: Fonction assistant (aide conversationnelle)
        run: supabase functions deploy assistant --project-ref "$PROJECT_REF"
      - name: Fonction dvf (estimation, repli serveur)
        run: supabase functions deploy dvf --project-ref "$PROJECT_REF"
      - name: Fonction annonce (lecture d'une annonce à partir de son lien)
        run: supabase functions deploy annonce --project-ref "$PROJECT_REF"
      - name: Adresses à utiliser
        run: |
          echo "Webhook Stripe : https://${PROJECT_REF}.supabase.co/functions/v1/stripe-webhook" >> "$GITHUB_STEP_SUMMARY"
          echo "Tâche planifiée : https://${PROJECT_REF}.supabase.co/functions/v1/daily" >> "$GITHUB_STEP_SUMMARY"
